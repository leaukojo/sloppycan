# Syntax gate on every push/PR; publish the dev channel on a push to dev.
#
# There is no build step. `node --check` catches syntax - these are classic
# non-module scripts sharing a global lexical scope, so a stray syntax error takes
# the whole page down, not just one file. The static checks, the relay tests and
# the headless-Chrome smoke test (.github/scripts/) catch what only shows up at
# runtime. No dependency is committed: puppeteer is installed here only.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every script
        run: |
          fail=0
          for f in js/*.js explainers/*.js; do
            [ -e "$f" ] || continue
            node --check "$f" || fail=1
          done
          exit $fail

      # js/carlito_contract.js is generated (tools/gen_js_contract.mjs in the carlito
      # repo) and must set window.CARLITO_CONTRACT with a version - a truncated or
      # half-pasted copy would otherwise only surface as a runtime warning. The body is the
      # contract text verbatim and CARLITO_CONTRACT_HASH its SHA-256, so re-hashing the body
      # catches a hand edit to the copy, however neatly formatted.
      - name: Contract copy sanity
        run: |
          node -e '
            const vm = require("vm");
            const fs = require("fs");
            const crypto = require("crypto");
            const file = process.argv[1] || "js/carlito_contract.js";
            const text = fs.readFileSync(file, "utf8").replace(/\r\n/g, "\n");
            const ctx = { window: {} };
            vm.createContext(ctx);
            vm.runInContext(text, ctx);
            const c = ctx.window.CARLITO_CONTRACT;
            if (!c) throw new Error("carlito_contract.js did not set window.CARLITO_CONTRACT");
            if (!(c.version > 0)) throw new Error("contract has no usable version: " + c.version);
            if (!Array.isArray(c.signals) || !c.signals.length) throw new Error("contract carries no signals");
            const head = "\nwindow.CARLITO_CONTRACT = ", tail = ";\nwindow.CARLITO_CONTRACT_HASH = ";
            const a = text.indexOf(head), b = text.indexOf(tail);
            if (a < 0 || b < a || typeof ctx.window.CARLITO_CONTRACT_HASH !== "string")
              throw new Error("carlito_contract.js lacks its body or CARLITO_CONTRACT_HASH: regenerate in carlito");
            const hash = crypto.createHash("sha256").update(text.slice(a + head.length, b), "utf8").digest("hex");
            if (hash !== ctx.window.CARLITO_CONTRACT_HASH)
              throw new Error("hand-edited generated copy: its body hashes to " + hash.slice(0, 12) +
                ", not the stamped " + ctx.window.CARLITO_CONTRACT_HASH.slice(0, 12) + ". Regenerate in carlito.");
            console.log("contract v" + c.version + " " + hash.slice(0, 12) + ", " + c.signals.length + " signals");
          '

      # Inline on*="..." handlers call functions that exist; every <script src> exists.
      - name: Static checks
        run: node .github/scripts/static-checks.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python checks
        run: |
          python -m py_compile scripting/*.py
          python -m unittest discover -s scripting -p 'test_*.py' -v

  # Both app pages load clean, every window.*SelfTest passes (fresh and after demo traffic),
  # each demo base traffic runs, and telemetry reaches the frame table.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer (CI only - nothing is committed)
        run: npm install --no-save --no-package-lock puppeteer
      - name: Smoke test
        run: node .github/scripts/smoke.mjs

  publish-dev:
    needs: [check, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with promote.yml: both force-push gh-pages, and a race would
    # silently drop one channel's update.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The site IS the checkout, minus the things that only matter to the repo.
      - name: Stage the site
        run: |
          mkdir -p ../site
          rsync -a ./ ../site/ \
            --exclude .git --exclude .github --exclude .claude \
            --exclude .gitattributes \
            --exclude /AUDIT.md --exclude /audit --exclude 'scripting/test_*.py'

      - name: Publish to gh-pages:/dev/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_SHA: ${{ github.sha }}
        # Invoked via `bash` rather than executed directly: the repo is authored on
        # Windows, where git does not track the exec bit.
        run: bash .github/scripts/publish-pages.sh dev ../site

      - name: Summary
        run: |
          {
            echo "### Published dev"
            echo ""
            echo "- <https://leaukojo.github.io/sloppycan/dev/> now serves \`${{ github.sha }}\`"
            echo ""
            echo "Stable is unchanged. Promote with Actions -> \"Promote dev -> stable\"."
          } >> "$GITHUB_STEP_SUMMARY"
